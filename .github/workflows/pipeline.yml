name: Run Capstone Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'pipeline/**'
      - 'main.py'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'pipeline/**'
      - 'main.py'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Full Pipeline
      run: |
        python main.py

    - name: Upload Pipeline Artifacts (Data & Reports)
      uses: actions/upload-artifact@v4
      with:
        name: capstone-pipeline-outputs
        path: |
          data/final/master_dataset_all_variables.csv
          data/final/x_test.csv
          data/final/x_train.csv
          data/final/y_test.csv
          data/final/y_train.csv
          data/final/eda_summary_report.html
          data/final/modeling_summary_report.html
          data/final/best_model_pipeline.joblib
        retention-days: 2